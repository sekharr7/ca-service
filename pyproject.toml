readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-storage-blob>=12.20.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "openai>=1.40.0",
    "openpyxl>=3.1.5",
    "pillow>=10.0.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
]
